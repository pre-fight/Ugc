<style>

*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--t);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom))}

header{position:sticky;top:0;z-index:20;background:rgba(11,11,18,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--b);padding-top:env(safe-area-inset-top)}
.hd{max-width:1080px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 14px}
.logo{font-weight:800;font-size:22px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer;letter-spacing:-.5px}
.sr{flex:1;max-width:340px;background:var(--card);border:1px solid var(--b);border-radius:12px;padding:8px 12px;outline:0}
.sp{flex:1}.btn{background:var(--g);border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;color:#fff}
.btn.o{background:transparent;border:1px solid var(--b)}.btn.s{padding:6px 12px;font-size:13px}.btn:active{transform:scale(.97)}
nav{display:flex;gap:4px}nav button{background:0;border:0;padding:8px 14px;border-radius:10px;cursor:pointer;color:var(--m);font-weight:600}nav button.on{color:#fff;background:var(--card)}

.med .ti{position:relative;width:100%;padding:40px 14px 14px;background:linear-gradient(transparent,rgba(0,0,0,.7));font-weight:700;font-size:17px}

@media(min-width:600px){#m{align-items:center}.bx{border-radius:20px}}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--b);background:0;cursor:pointer}.seg .on{background:var(--g);border-color:transparent;color:#fff}
.cm{padding:6px 0;border-bottom:1px solid var(--b);font-size:14px}.cl{max-height:40vh;overflow:auto}.row{display:flex;gap:8px}.row .btn{flex:none}

<script>
const URL_='https://rpkthhsyaaldjdvaqztc.supabase.co',KEY='sb_publishable_3tLAf7lr8xvFm-dloTyaLA_WlGPohj3';
let sb=null;try{sb=supabase.createClient(URL_,KEY)}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue=s=>{let n=0;for(const c of String(s))n=(n*31+c.charCodeAt(0))%360;return n};
const grad=s=>`linear-gradient(135deg,hsl(${hue(s)},70%,45%),hsl(${(hue(s)+60)%360},75%,32%))`;
const ini=n=>String(n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
const av=(n,id,z=40)=>`<div class="av" style="width:${z}px;height:${z}px;background:${grad(id)};font-size:${z*.38}px">${esc(ini(n))}</div>`;
const money=(a,b,c)=>a==null?'Negotiable':`${esc(c||'USD')} ${Math.round(a)}${b?'-'+Math.round(b):''}`;
const ago=d=>{const m=(Date.now()-new Date(d))/6e4;return m<60?Math.max(1,~~m)+'m':m<1440?~~(m/60)+'h':~~(m/1440)+'d'};
const LS={g(k){try{return localStorage.getItem(k)}catch(e){return null}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let D={videos:[],creators:[],offers:[],rate:{}},U=null,P=null,LK=new Set(),T='feed',Q='',DEMO=false,AT='creator',FN='',FB='';
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',2600)}
function modal(h){$('#bx').innerHTML=h;$('#m').classList.add('on')}
function closeM(){$('#m').classList.remove('on')}
$('#m').addEventListener('click',e=>{if(e.target.id==='m')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});

function demo(){DEMO=true;const N=['Sara Ahmed','Omar Khaled','Nour Hassan','Youssef Ali','Mariam Adel','Karim Samir','Laila Mostafa','Hana Tarek'],NI=['Beauty','Fashion','Tech','Food','Fitness','Travel','Pets','Lifestyle'];
D.creators=N.map((n,i)=>({id:'d'+i,niches:[NI[i],NI[(i+3)%8]],age_range:['18-24','25-34'][i%2],rate_min:50+i*20,rate_max:150+i*40,currency:'USD',is_available:i%4!=3,profiles:{display_name:n,country:'Egypt',bio:'UGC creator focused on '+NI[i].toLowerCase()+' content.'}}));
D.videos=D.creators.flatMap((c,i)=>[0,1].map(j=>({id:'dv'+i+j,title:['Unboxing + honest review','Get ready with me'][j],description:'Sample UGC piece.',niche:c.niches[0],created_at:new Date(Date.now()-(i*2+j)*36e5).toISOString(),creator_id:c.id,likes:[{count:20+i*7+j*3}],comments:[{count:i+j}],creator_profiles:c})));
D.offers=NI.slice(0,5).map((n,i)=>({id:'do'+i,title:'Looking for UGC videos - '+n,description:'Authentic short-form videos. Product shipped free.',niche:n,budget_min:100+i*40,budget_max:300+i*80,currency:'USD',deadline:new Date(Date.now()+864e5*(10+i*3)).toISOString().slice(0,10),brand_profiles:{company_name:['Glow Lab','Urban Thread','Petopia','TechNest','FreshBite'][i]}}));D.rate={}}

async function load(){
 if(!sb)return demo();
 try{
  const [v,c,o,r]=await Promise.all([
   sb.from('videos').select('id,title,description,niche,created_at,creator_id,likes(count),comments(count),creator_profiles(rate_min,rate_max,currency,age_range,niches,profiles(display_name,country))').order('created_at',{ascending:false}).limit(60),
   sb.from('creator_profiles').select('id,niches,age_range,rate_min,rate_max,currency,is_available,profiles(display_name,country,bio)').limit(100),
   sb.from('offers').select('*,brand_profiles(company_name,industry)').eq('status','open').order('created_at',{ascending:false}).limit(60),
   sb.from('creator_ratings').select('*')]);
  if(v.error||c.error||o.error)throw new Error('load');
  D.videos=v.data||[];D.creators=c.data||[];D.offers=o.data||[];D.rate={};(r.data||[]).forEach(x=>D.rate[x.creator_id]=x);
  D.videos.sort((a,b)=>hue(a.id)-hue(b.id));
  if(!D.videos.length)demo();
 }catch(e){demo()}
}
async function setUser(u){U=u;P=null;LK=new Set();
 if(u&&sb){try{const [p,l]=await Promise.all([sb.from('profiles').select('display_name,account_type').eq('id',u.id).single(),sb.from('likes').select('video_id').eq('user_id',u.id)]);P=p.data;(l.data||[]).forEach(x=>LK.add(x.video_id))}catch(e){}}
 hdr();render()}
function hdr(){$('#au').innerHTML=U?`<span style="display:flex;gap:8px;align-items:center">${av(P?P.display_name:'Me',U.id,32)}<button class="btn o s" onclick="logout()">Log out</button></span>`:`<button class="btn o s" onclick="authModal('login')">Log in</button> <button class="btn s" onclick="authModal('signup')">Sign up</button>`}
async function logout(){if(sb)await sb.auth.signOut();toast('Logged out')}

function authModal(m){m=m||'login';const s=m==='signup';
 modal(`<h3>${s?'Join UGCHub':'Welcome back'}</h3>${s?`<div class="seg"><button class="${AT==='creator'?'on':''}" onclick="setT('creator')">UGC Creator</button><button class="${AT==='brand'?'on':''}" onclick="setT('brand')">Brand / Hiring</button></div><input id="an" placeholder="${AT==='brand'?'Company name':'Full name'}" maxlength="60">`:''}<input id="ae" type="email" placeholder="Email" autocomplete="email"><input id="ap" type="password" placeholder="Password (min 6)" autocomplete="${s?'new-password':'current-password'}"><button class="btn" onclick="auth('${m}')">${s?'Create account':'Log in'}</button><p class="mut">${s?`Have an account? <a href="#" onclick="authModal('login');return false">Log in</a>`:`New here? <a href="#" onclick="authModal('signup');return false">Sign up free</a>`}</p>`)}
function setT(t){const n=$('#an'),e=$('#ae');FN=n?n.value:'';FB=e?e.value:'';AT=t;authModal('signup');$('#an').value=FN;$('#ae').value=FB}
async function auth(m){
 if(!sb)return toast('Connection unavailable right now');
 const email=$('#ae').value.trim(),password=$('#ap').value;
 if(!email||password.length<6)return toast('Enter your email and a 6+ character password');
 if(m==='login'){const r=await sb.auth.signInWithPassword({email,password});if(r.error)return toast(r.error.message);closeM();toast('Welcome back')}
 else{const name=$('#an').value.trim();if(name.length<2)return toast('Please enter your name');
  const r=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname,data:{account_type:AT,display_name:name}}});
  if(r.error)return toast(r.error.message);closeM();toast(r.data.session?'Account created':'Check your email to confirm your account')}}
function need(){if(U)return true;authModal('signup');return false}

async function like(id){
 if(!need())return;const on=LK.has(id);on?LK.delete(id):LK.add(id);
 const v=D.videos.find(x=>x.id===id);if(v){v.likes=[{count:Math.max(0,((v.likes&&v.likes[0]&&v.likes[0].count)||0)+(on?-1:1))}]}render();
 if(DEMO||!sb)return;
 const r=on?await sb.from('likes').delete().eq('user_id',U.id).eq('video_id',id):await sb.from('likes').insert({user_id:U.id,video_id:id});
 if(r.error)toast('Could not save your like')}
async function share(id){const u=location.href.split('#')[0];
 try{if(navigator.share)await navigator.share({title:'UGCHub',text:'Check this out on UGCHub',url:u});else{await navigator.clipboard.writeText(u);toast('Link copied')}
  if(U&&sb&&!DEMO)sb.from('shares').insert({video_id:id,user_id:U.id})}catch(e){}}
async function comments(id){
 modal(`<h3>Comments</h3><div class="cl" id="cl"><p class="mut">Loading...</p></div>${U?`<div class="row"><input id="ci" maxlength="500" placeholder="Add a comment..."><button class="btn" onclick="addC('${id}')">Post</button></div>`:`<button class="btn" onclick="authModal('login')">Log in to comment</button>`}`);
 let l=[];if(sb&&!DEMO){const r=await sb.from('comments').select('body,created_at,profiles(display_name)').eq('video_id',id).order('created_at').limit(100);l=r.data||[]}
 $('#cl').innerHTML=l.length?l.map(c=>`<div class="cm"><b>${esc(c.profiles&&c.profiles.display_name)}</b> ${esc(c.body)}</div>`).join(''):'<p class="mut">No comments yet. Be the first.</p>'}
async function addC(id){const b=$('#ci').value.trim();if(!b)return;if(DEMO)return toast('Demo mode');
 const r=await sb.from('comments').insert({video_id:id,user_id:U.id,body:b});if(r.error)return toast('Could not post comment');
 const v=D.videos.find(x=>x.id===id);if(v)v.comments=[{count:((v.comments&&v.comments[0]&&v.comments[0].count)||0)+1}];comments(id);render()}
async function connect(id){if(!need())return;if(id===U.id)return toast("That's you");if(DEMO)return toast('Demo mode');
 const r=await sb.from('connections').insert({requester_id:U.id,addressee_id:id});toast(r.error?(r.error.code==='23505'?'Request already sent':'Could not send request'):'Connection request sent')}
function apply(id){if(!need())return;if(P&&P.account_type!=='creator')return toast('Only creator accounts can apply');
 modal(`<h3>Apply to this offer</h3><textarea id="am" rows="4" maxlength="1000" placeholder="Why are you a great fit? Share your rate and a link to your best work."></textarea><button class="btn" onclick="sendApply('${id}')">Send application</button>`)}
async function sendApply(id){const msg=$('#am').value.trim();closeM();if(DEMO)return toast('Demo mode');
 const r=await sb.from('applications').insert({offer_id:id,creator_id:U.id,message:msg||null});toast(r.error?(r.error.code==='23505'?'You already applied':'Could not apply'):'Application sent')}
function prof(id){const c=D.creators.find(x=>x.id===id);if(!c)return;const p=c.profiles||{},r=D.rate[id],vs=D.videos.filter(v=>v.creator_id===id);
 modal(`<div style="display:flex;gap:12px;align-items:center">${av(p.display_name,id,64)}<div><h3>${esc(p.display_name)}</h3><span class="mut">${esc(p.country||'')}${c.age_range?' | Age '+esc(c.age_range):''}</span></div></div><p>${esc(p.bio||'')}</p><div>${(c.niches||[]).map(n=>`<span class="chip">${esc(n)}</span>`).join('')}</div><p><b class="bg">${money(c.rate_min,c.rate_max,c.currency)}</b> per video${r?` | ★ ${r.avg_rating} (${r.review_count})`:''}</p><p class="mut">${vs.length} videos: ${vs.slice(0,3).map(v=>esc(v.title)).join(', ')}</p><button class="btn" onclick="closeM();connect('${id}')">Connect</button>`)}

function postH(v){const cp=v.creator_profiles||{},p=cp.profiles||{},id=v.id,on=LK.has(id),lc=(v.likes&&v.likes[0]&&v.likes[0].count)||0,cc=(v.comments&&v.comments[0]&&v.comments[0].count)||0;
 return `<article class="card"><div class="ph">${av(p.display_name,v.creator_id)}<div><b onclick="prof('${v.creator_id}')">${esc(p.display_name)}</b><small>${esc(p.country||'')} | ${ago(v.created_at)}</small></div></div>
<div class="med" style="background:${grad(id)}" ondblclick="like('${id}')"><span class="tag">${esc(v.niche||'UGC')}</span><span class="tag dur">0:${20+hue(id)%35}</span><div class="play">▶</div><div class="ti">${esc(v.title)}</div></div>
<div class="ac"><span onclick="like('${id}')" style="color:${on?'#ec4899':'inherit'}">${on?'♥':'♡'}</span><span onclick="comments('${id}')">💬</span><span onclick="share('${id}')">➤</span><button class="btn s" onclick="connect('${v.creator_id}')">Connect</button></div>
<div class="pb"><b>${lc} likes</b><br><b>${esc(p.display_name)}</b> ${esc(v.description||'')}<br><a onclick="comments('${id}')">View all ${cc} comments</a><br><span class="mut">Rate: ${money(cp.rate_min,cp.rate_max,cp.currency)}</span></div></article>`}
function ofH(o){const b=o.brand_profiles||{};return `<div class="card of"><div class="rw" style="padding:0">${av(b.company_name,o.brand_id||o.id,36)}<div><b>${esc(b.company_name)}</b><br><span class="mut">${esc(b.industry||o.niche||'')}</span></div></div><h4>${esc(o.title)}</h4><p class="mut">${esc(o.description||'')}</p><div><span class="bg">${money(o.budget_min,o.budget_max,o.currency)}</span> ${o.niche?`<span class="chip">${esc(o.niche)}</span>`:''}${o.deadline?`<span class="chip">Due ${esc(o.deadline)}</span>`:''}</div><button class="btn" onclick="apply('${o.id}')">Apply now</button></div>`}
function crH(c){const p=c.profiles||{},r=D.rate[c.id];return `<div class="card cc">${av(p.display_name,c.id,72)}<h4 onclick="prof('${c.id}')">${esc(p.display_name)}</h4><span class="mut">${esc(p.country||'')}${c.age_range?' | Age '+esc(c.age_range):''}</span><div>${(c.niches||[]).map(n=>`<span class="chip">${esc(n)}</span>`).join('')}</div><b class="bg">${money(c.rate_min,c.rate_max,c.currency)}</b><span class="mut">${r?'★ '+r.avg_rating+' ('+r.review_count+' reviews) | ':''}<span class="${c.is_available?'ok':''}">${c.is_available?'Available':'Booked'}</span></span><div class="row"><button class="btn s" onclick="connect('${c.id}')">Connect</button><button class="btn o s" onclick="prof('${c.id}')">Profile</button></div></div>`}
const hit=(...a)=>!Q||a.join(' ').toLowerCase().includes(Q);

function render(){
 const m=$('#app');m.className=T==='feed'?'f':'';
 $('#nv').innerHTML=[['feed','Feed'],['creators','Creators'],['offers','Offers']].map(([k,l])=>`<button class="${T===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 if(T==='feed'){
  const vs=D.videos.filter(v=>{const p=(v.creator_profiles||{}).profiles||{};return hit(v.title,v.niche,p.display_name)});
  m.innerHTML=`<div class="col">${U?'':`<div class="hero"><h2>Where UGC creators get hired.</h2><p>Browse creators and open offers for free. Create an account when you're ready to apply or hire.</p><button class="btn" onclick="authModal('signup')">Join free</button></div>`}
